    if (map[h]) { window.location.replace(map[h]); return; }
    this._onScroll = () => {
      const y = window.scrollY;
      if ((y > 40) !== this.state.navScrolled) this.setState({ navScrolled: y > 40 });

      const ids = ['suono', 'ascolto', 'live', 'contatti'];
      let current = this.state.activeSection;
      for (const id of ids) {
        const el = this.rootEl && this.rootEl.querySelector('#' + id);
        if (el) {
          const r = el.getBoundingClientRect();
          if (r.top <= window.innerHeight * 0.5 && r.bottom >= window.innerHeight * 0.3) current = id;
        }
      }
      if (current !== this.state.activeSection) this.setState({ activeSection: current });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onScroll();

    this._onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this._onResize);

    this.applyThemeColor('dark');

    try {
      const lang = localStorage.getItem('liminals-lang');
      if (lang && ['IT','EN','FR','ES'].indexOf(lang) !== -1) {
        this.setState({ language: lang });
        document.documentElement.lang = lang.toLowerCase();
      }
    } catch (e) {}

    if ('IntersectionObserver' in window && this.rootEl) {
      this._ro = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (en.isIntersecting) {
            const key = en.target.getAttribute('data-reveal-key');
            if (key) {
              this.setState((s) => ({ revealed: Object.assign({}, s.revealed, { [key]: true }) }));
              this._ro.unobserve(en.target);
            }
          }
        });
      }, { threshold: 0.14, rootMargin: '0px 0px -8% 0px' });
      this.rootEl.querySelectorAll('[data-reveal-key]').forEach((el) => this._ro.observe(el));
    } else {
      this.setState({ revealed: { all: true } });
    }
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onResize);
    if (this._ro) this._ro.disconnect();
  }

  setRootEl = (el) => {
    this.rootEl = el;
    if (el && !this._observed && 'IntersectionObserver' in window) {
      // mark elements once mounted; observer attached in componentDidMount
      this._observed = true;
    }
  };

  setHeroDarkImgEl = (el) => { this._heroDarkImgEl = el; };
  setHeroLightImgEl = (el) => { this._heroLightImgEl = el; };

  getPitchHtmlDataUrl() {
    return 'assets/pitch/Liminals-Pitch.html';
  }

    return 'assets/pitch/Liminals-Pitch.pdf';
  }

  applyThemeColor(theme) {
    try {
      const c = theme === 'light' ? '#FEFAEF' : '#151515';
      let m = document.querySelector('meta[name="theme-color"]');
      if (!m) { m = document.createElement('meta'); m.setAttribute('name','theme-color'); document.head.appendChild(m); }
      m.setAttribute('content', c);
      document.documentElement.style.background = c;
      document.body.style.background = c;
    } catch(e) {}
  }

  cycleLanguage = () => {
    const order = ['IT', 'EN', 'FR', 'ES'];
    const i = order.indexOf(this.state.language || 'IT');
    const next = order[(i + 1) % order.length];
    this.setState({ language: next });
    try { localStorage.setItem('liminals-lang', next); } catch (e) {}
    try { document.documentElement.lang = next.toLowerCase(); } catch (e) {}
  };

  toggleMenu = () => { this.setState((s) => ({ menuOpen: !s.menuOpen })); };
  closeMenu = () => { this.setState({ menuOpen: false }); };

  openManifestoFromMenu = () => { this.setState({ page: 'manifesto', menuOpen: false }); window.scrollTo(0, 0); };
  goHome = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ page: 'home', menuOpen: false }); window.scrollTo(0, 0); };

  glitchEnter = (e) => {
    const el = e.currentTarget;
    const target = el.querySelector('[data-glitch-text]') || el;
    const original = target._glitchTimer
      ? target._glitchOriginal
      : (el.getAttribute('data-original') || target.textContent);
    target._glitchOriginal = original;
    const chars = '!<>-_\\/[]{}—=+*^?#01010$%&@';
    if (target._glitchTimer) clearInterval(target._glitchTimer);
    let iter = 0;
    const total = original.length;
    target._glitchTimer = setInterval(() => {
      const revealed = Math.floor(iter / 2);
      let out = '';
      for (let i = 0; i < total; i++) {
        if (i < revealed) out += original[i];
        else if (original[i] === ' ') out += ' ';
        else out += chars[Math.floor(Math.random() * chars.length)];
      }
      target.textContent = out;
      iter++;
      if (revealed >= total) { clearInterval(target._glitchTimer); target._glitchTimer = null; target.textContent = original; }
    }, 60);
  };

  glitchLeave = (e) => {
    const el = e.currentTarget;
    const target = el.querySelector('[data-glitch-text]') || el;
    if (target._glitchTimer) { clearInterval(target._glitchTimer); target._glitchTimer = null; }
    if (target._glitchOriginal) target.textContent = target._glitchOriginal;

  notifyStatusReset = (status) => {
    status.style.color = 'var(--dim)';
    status.style.fontFamily = "'Satoshi',sans-serif";
    status.style.fontWeight = '400';
    status.style.fontSize = '14px';
    status.style.border = 'none';
    status.style.background = 'none';
    status.style.padding = '0';
    status.style.borderRadius = '0';
    status.style.display = 'block';
    status.style.marginTop = '10px';
  };

  notifySubmit = () => {
    const t = this.homeT[this.state.language] || this.homeT.IT;
    const input = document.getElementById('notify-email');
    const status = document.getElementById('notify-status');
    if (!input || !status) return;
    this.notifyStatusReset(status);
    const email = (input.value || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      status.style.color = 'var(--accent)';
      status.style.fontWeight = '500';
      status.textContent = t.notifyInvalid;
      return;
    }
    status.textContent = t.notifyWait;
    fetch('https://formspree.io/f/mwvgrrew', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email: email, _subject: 'Avvisami: nuova iscrizione dal sito' })
    }).then((r) => {
      if (r.ok) {
        status.style.color = 'var(--cream)';
        status.style.fontFamily = "'Outfit',sans-serif";
        status.style.fontWeight = '500';
        status.style.fontSize = '16px';
        status.style.border = '1px solid var(--accent)';
        status.style.background = 'color-mix(in srgb, var(--accent) 10%, transparent)';
        status.style.padding = '12px 18px';
        status.style.borderRadius = '14px';
        status.style.display = 'inline-block';
        status.style.marginTop = '14px';
        status.textContent = t.notifyOk;
        input.value = '';
      } else {
        status.style.color = 'var(--accent)';
        status.style.fontWeight = '500';
        status.textContent = t.notifyErr;
      }
    }).catch(() => {
      status.style.color = 'var(--accent)';
      status.style.fontWeight = '500';
      status.textContent = t.notifyErr;
    });
  };

  copyEmail = (e) => {
    const email = 'hello@liminalsmusic.com';
    if (navigator.clipboard) {
      e.preventDefault();
      navigator.clipboard.writeText(email).then(() => {
        this.setState({ toastShow: true });
        setTimeout(() => this.setState({ toastShow: false }), 1800);
      }).catch(() => { window.location.href = 'mailto:' + email; });
    }
  };

      transitionProperty: 'opacity, transform',
      transitionDuration: '0.9s',
      transitionTimingFunction: 'cubic-bezier(.2,.6,.2,1)',
