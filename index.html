/* --- bottone menu: rettangolo con testo + quadratino (rif. No Art) --- */

<script>
(function () {
  var html = document.documentElement;
  var root = document.getElementById('root');

  /* --- lingua: IT / EN, persistita in localStorage --- */
  var LANGS = ['it', 'en'];
  function setLang(l) {
    html.lang = l;
    try { localStorage.setItem('liminals-lang', l.toUpperCase()); } catch (e) {}
  }
  try {
    var saved = (localStorage.getItem('liminals-lang') || '').toLowerCase();
    if (LANGS.indexOf(saved) !== -1 && saved !== html.lang) html.lang = saved;
  } catch (e) {}
  document.querySelectorAll('[data-lang-toggle]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setLang(html.lang === 'it' ? 'en' : 'it');
    });
  });

  /* --- menu mobile --- */
  var menuBtn = document.querySelector('[data-menu-toggle]');
  function closeMenu() {
    root.classList.remove('menu-open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', function () {
    var open = root.classList.toggle('menu-open');
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.querySelectorAll('.menu-link').forEach(function (a) {
    a.addEventListener('click', closeMenu);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && root.classList.contains('menu-open')) { closeMenu(); menuBtn.focus(); }
  });

  /* --- effetto glitch sui link in hover --- */
  var CHARS = '!<>-_\\/[]{}—=+*^?#01010$%&@';
  function glitchTarget(el) {
    return el.querySelector('[data-glitch-text][data-lang="' + html.lang + '"]') || el;
  }
  function glitchEnter(e) {
    var target = glitchTarget(e.currentTarget);
    var original = target._glitchTimer ? target._glitchOriginal : target.textContent;
    target._glitchOriginal = original;
    if (target._glitchTimer) clearInterval(target._glitchTimer);
    var iter = 0, total = original.length;
    target._glitchTimer = setInterval(function () {
      var revealed = Math.floor(iter / 2), out = '';
      for (var i = 0; i < total; i++) {
        if (i < revealed) out += original[i];
        else if (original[i] === ' ') out += ' ';
        else out += CHARS[Math.floor(Math.random() * CHARS.length)];
      }
      target.textContent = out;
      iter++;
      if (revealed >= total) { clearInterval(target._glitchTimer); target._glitchTimer = null; target.textContent = original; }
    }, 60);
  }
  function glitchLeave(e) {
    var target = glitchTarget(e.currentTarget);
    if (target._glitchTimer) { clearInterval(target._glitchTimer); target._glitchTimer = null; }
    if (target._glitchOriginal) target.textContent = target._glitchOriginal;
  }
  document.querySelectorAll('[data-glitch]').forEach(function (a) {
    a.addEventListener('mouseenter', glitchEnter);
    a.addEventListener('mouseleave', glitchLeave);
  });
})();
</script>
