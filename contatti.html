<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liminals — Contact</title>
<meta name="description" content="Contatti Liminals. Scrivici a hello@liminalsmusic.com o usa il modulo.">
<meta property="og:title" content="Liminals — Contact">
<meta property="og:image" content="assets/img/og.jpg">
<link rel="icon" href="assets/img/favicon.png">
<style>
@font-face { font-family:'Outfit'; font-weight:300; font-style:normal; font-display:swap; src:url('assets/fonts/Outfit-Light.otf') format('opentype'); }
@font-face { font-family:'Outfit'; font-weight:400; font-style:normal; font-display:swap; src:url('assets/fonts/Outfit-Regular.otf') format('opentype'); }
@font-face { font-family:'Outfit'; font-weight:500; font-style:normal; font-display:swap; src:url('assets/fonts/Outfit-Medium.otf') format('opentype'); }

:root {
  --bg: #151515;
  --cream: #FEFAEF;
  --accent: #FC4446;
  --margin: clamp(1.5rem, 5.8vw, 5.1rem);
}

*, *::before, *::after { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--cream);
  font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 300;
  font-size: 1.05rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
a:hover, a:focus-visible { color: var(--accent); }

/* Header */
.top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 2rem;
  padding: clamp(2.5rem, 6vw, 5rem) var(--margin) 0;
}
.logo { font-weight: 500; font-size: 1.5rem; line-height: 1.2; }
.nav { display: flex; flex-direction: column; font-size: 1.5rem; line-height: 1.2; }
.nav a[aria-current="page"] { color: var(--accent); }

/* Contenuto: form a sinistra, riferimenti a destra */
.content {
  display: grid;
  grid-template-columns: minmax(0, 26rem) minmax(0, 1fr);
  column-gap: clamp(3rem, 12vw, 12rem);
  align-items: start;
  padding: clamp(4rem, 12vh, 9rem) var(--margin) 6rem;
  margin-left: clamp(0rem, 14vw, 13rem);
}

.label { font-weight: 400; font-size: 1.05rem; margin: 0; }

/* Form */
.scrivi { display: block; }
.scrivi .campo { display: block; margin-bottom: 2rem; }
.scrivi .campo > span { display: block; font-weight: 400; }

.scrivi input[type="text"],
.scrivi input[type="email"],
.scrivi textarea {
  display: block;
  width: 100%;
  margin: .35rem 0 0;
  padding: .35rem 0;
  background: transparent;
  color: var(--cream);
  border: 0;
  border-bottom: 1px solid rgba(254, 250, 239, .45);
  border-radius: 0;
  font: inherit;
  font-weight: 300;
  outline: none;
  resize: none;
  transition: border-color .15s;
}
.scrivi textarea { min-height: 7.5rem; }
.scrivi input:focus,
.scrivi textarea:focus { border-bottom-color: var(--accent); }

.scrivi input:-webkit-autofill {
  -webkit-text-fill-color: var(--cream);
  box-shadow: 0 0 0 100px var(--bg) inset;
}

.scrivi button {
  padding: 0;
  background: none;
  border: 0;
  color: var(--cream);
  font: inherit;
  font-weight: 400;
  cursor: pointer;
}
.scrivi button:hover,
.scrivi button:focus-visible { color: var(--accent); outline: none; }

/* campo antispam, fuori schermo */
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* esito invio: il server reindirizza a #inviato o #errore */
.esito { display: none; margin: 0 0 2rem; color: var(--accent); scroll-margin-top: 30rem; }
.esito:target { display: block; }

/* Riferimenti */
.info p { margin: 0; }
.info .blocco { margin-bottom: 2rem; }

/* Mobile: tutto in colonna, riferimenti prima del form */
@media (max-width: 760px) {
  .top { justify-content: flex-start; gap: clamp(2.5rem, 14vw, 5rem); }
  .logo, .nav { font-size: 1.35rem; }
  .content { display: flex; flex-direction: column-reverse; align-items: stretch; margin-left: 0; padding-top: 4rem; }
  .info { margin-bottom: 3rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="index.html">Liminals</a>
  <nav class="nav" aria-label="Principale">
    <a href="about.html">/About</a>
    <a href="music.html">/Music</a>
    <a href="contatti.html" aria-current="page">/Contact</a>
  </nav>
</header>

<main class="content">

  <section class="scrivi-wrap" aria-labelledby="scrivi-titolo">
    <p class="label" id="scrivi-titolo">/Scrivici</p>
    <br>

    <p class="esito" id="inviato" role="status">Messaggio inviato. Ti rispondiamo da hello@liminalsmusic.com.</p>
    <p class="esito" id="errore" role="alert">Invio non riuscito. Scrivi direttamente a hello@liminalsmusic.com.</p>

    <form class="scrivi" action="/api/contact" method="POST">
      <label class="campo"><span>/Nome</span>
        <input type="text" name="nome" autocomplete="name" required>
      </label>
      <label class="campo"><span>/Email</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label class="campo"><span>/Messaggio</span>
        <textarea name="messaggio" rows="5" required></textarea>
      </label>
      <div class="hp" aria-hidden="true">
        <input type="text" name="sito" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit">/Invia</button>
    </form>
  </section>

  <section class="info" aria-label="Riferimenti">
    <div class="blocco">
      <p class="label">/E-mail</p>
      <p><a href="mailto:hello@liminalsmusic.com">hello@liminalsmusic.com</a></p>
    </div>
    <div class="blocco">
      <p class="label">/Social</p>
      <p>Instagram: <a href="https://instagram.com/enricogiachin" target="_blank" rel="noopener">@enricogiachin</a></p>
    </div>
    <div class="blocco">
      <p class="label">/Spotify</p>
      <p>zacku</p>
    </div>
  </section>

</main>

</body>
</html>
